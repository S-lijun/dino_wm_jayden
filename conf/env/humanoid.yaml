# conf/env/humanoid.yaml

name: humanoid
args: []
kwargs: {}

dataset:
  _target_: "datasets.humanoid_dset.load_humanoid_slice_train_val"
  n_rollout: null
  normalize_action: False
  data_path: ${oc.env:DATASET_DIR}/humanoid_g1/session_dir
  split_ratio: 0.9
  window_stride: 1
  transform:
    _target_: "datasets.img_transforms.letterbox_transform"
    img_h: ${img_h}
    img_w: ${img_w}

decoder_path: null
num_workers: 4
